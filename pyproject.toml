[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest"
version = "0.2.0"
description = "Design and analysis helpers for A/B testing two ML models"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luke Wamalwa" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
